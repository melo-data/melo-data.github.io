<!-- 入力フォーム -->
<input type="text" id="name" placeholder="お名前">
<input type="text" id="message" placeholder="メッセージ">
<button onclick="sendData()">送信する</button>
<button onclick="loadData()">受信する</button>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbyC-omvVcgfeEAJ2q73uFqUEf81-Sy-UwjA_CyXRl8OKQmCHkVjsUiPoKjqr5nNEAlq/exec";

  // データ送信（書き込み）
  async function sendData() {
    const name = document.getElementById("name").value;
    const message = document.getElementById("message").value;

    await fetch(GAS_URL, {
      method: "POST",
      body: JSON.stringify({ name: name, message: message })
    });
    alert("登録完了しました！");
  }

  // データ読み込み（表示）
  async function loadData() {
    const response = await fetch(GAS_URL);
    const data = await response.json();
    console.log("スプレッドシートのデータ:", data);
  }
</script>
